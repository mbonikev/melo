name: release

# Runs when you push a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Build a native binary per arch, package it, and attach it to the release.
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm # free ARM runner for public repos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        id: pkg
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="melo-${ver}-${{ matrix.arch }}"
          mkdir -p dist/stage
          install -m755 target/release/melo dist/stage/melo
          install -m644 LICENSE dist/stage/LICENSE
          install -m644 README.md dist/stage/README.md
          tar -czf "dist/${name}.tar.gz" -C dist/stage melo LICENSE README.md
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.tarball }}

  # After both binaries are uploaded, compute checksums and update the PKGBUILDs.
  pkgbuild-checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute checksums and update PKGBUILDs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"

          # Source tarball that the `melo` PKGBUILD builds from (GitHub auto-generates it).
          curl -fsSL -o src.tar.gz "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          src_sha="$(sha256sum src.tar.gz | cut -d' ' -f1)"

          # Prebuilt binary tarballs that the `melo-bin` PKGBUILD downloads.
          gh release download "$TAG" -R "$REPO" -p 'melo-*-x86_64.tar.gz' -p 'melo-*-aarch64.tar.gz' -D bins
          x86_sha="$(sha256sum bins/melo-${ver}-x86_64.tar.gz | cut -d' ' -f1)"
          arm_sha="$(sha256sum bins/melo-${ver}-aarch64.tar.gz | cut -d' ' -f1)"

          # --- source PKGBUILD ---
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=${ver}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${src_sha}')/" \
            packaging/PKGBUILD

          # --- melo-bin PKGBUILD ---
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=${ver}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${x86_sha}')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm_sha}')/" \
            packaging/melo-bin/PKGBUILD

          echo "source:      $src_sha"
          echo "bin x86_64:  $x86_sha"
          echo "bin aarch64: $arm_sha"

      - name: Commit updated PKGBUILDs
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No PKGBUILD changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/PKGBUILD packaging/melo-bin/PKGBUILD
          git commit -m "ci: update PKGBUILD checksums for ${GITHUB_REF_NAME}"
          git push origin main

  # Push the (now checksum-correct) PKGBUILDs to the AUR.
  # Requires the repo secret AUR_SSH_PRIVATE_KEY (an SSH key whose public half is
  # registered on your AUR account). Runs only on the canonical repo, not forks.
  publish-aur:
    needs: pkgbuild-checksums
    if: github.repository == 'mbonikev/melo'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: melo
            path: packaging/PKGBUILD
          - name: melo-bin
            path: packaging/melo-bin/PKGBUILD
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - name: Checkout main (with updated PKGBUILDs)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking accept-new
          EOF
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publish ${{ matrix.name }} to the AUR
        env:
          PKG: ${{ matrix.name }}
          SRC: ${{ matrix.path }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # makepkg refuses to run as root, so generate .SRCINFO as an unprivileged user.
          useradd -m builder
          git config --global --add safe.directory '*'

          git clone "ssh://aur@aur.archlinux.org/${PKG}.git" aur
          cp "$SRC" aur/PKGBUILD

          work="$(mktemp -d)"
          cp "$SRC" "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd '$work' && HOME=/home/builder makepkg --printsrcinfo" > aur/.SRCINFO

          cd aur
          git config user.name "Mbonikev"
          git config user.email "mb0ni@proton.me"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes for ${PKG}."
            exit 0
          fi
          git commit -m "${PKG} ${ver} (automated release)"
          git branch -M master
          git push origin master
