name: release

# Push-once workflow: on every push to main, if the version in Cargo.toml hasn't
# been released yet, CI tags it, builds binaries, publishes the GitHub Release,
# and syncs both AUR packages. Bump the version + push = a full release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide whether this push is a new release (Cargo.toml version not yet tagged).
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null 2>&1; then
            echo "v$ver is already released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$ver — tagging and releasing."
            git tag "v$ver"
            git push origin "v$ver"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Build a native binary per arch, package it, and attach it to the release.
  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm # free ARM runner for public repos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        id: pkg
        run: |
          name="melo-${VERSION}-${{ matrix.arch }}"
          mkdir -p dist/stage
          install -m755 target/release/melo dist/stage/melo
          install -m644 LICENSE dist/stage/LICENSE
          install -m644 README.md dist/stage/README.md
          tar -czf "dist/${name}.tar.gz" -C dist/stage melo LICENSE README.md
          echo "tarball=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          files: ${{ steps.pkg.outputs.tarball }}

  # After both binaries are uploaded, compute checksums and update the PKGBUILDs.
  pkgbuild-checksums:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute checksums and update PKGBUILDs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # Source tarball that the `melo` PKGBUILD builds from (GitHub auto-generates it).
          curl -fsSL -o src.tar.gz "https://github.com/${REPO}/archive/refs/tags/${tag}.tar.gz"
          src_sha="$(sha256sum src.tar.gz | cut -d' ' -f1)"

          # Prebuilt binary tarballs that the `melo-bin` PKGBUILD downloads.
          gh release download "$tag" -R "$REPO" -p 'melo-*-x86_64.tar.gz' -p 'melo-*-aarch64.tar.gz' -D bins
          x86_sha="$(sha256sum bins/melo-${VERSION}-x86_64.tar.gz | cut -d' ' -f1)"
          arm_sha="$(sha256sum bins/melo-${VERSION}-aarch64.tar.gz | cut -d' ' -f1)"

          # --- source PKGBUILD ---
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${src_sha}')/" \
            packaging/PKGBUILD

          # --- melo-bin PKGBUILD ---
          sed -i -E \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${x86_sha}')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm_sha}')/" \
            packaging/melo-bin/PKGBUILD

      - name: Commit updated PKGBUILDs
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No PKGBUILD changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/PKGBUILD packaging/melo-bin/PKGBUILD
          git commit -m "ci: update PKGBUILD checksums for v${VERSION} [skip ci]"
          git push origin main

  # Push the (now checksum-correct) PKGBUILDs to the AUR.
  # Requires the repo secret AUR_SSH_PRIVATE_KEY (an SSH key whose public half is
  # registered on your AUR account). Runs only on the canonical repo, not forks.
  publish-aur:
    needs: [gate, pkgbuild-checksums]
    if: needs.gate.outputs.release == 'true' && github.repository == 'mbonikev/melo'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: melo
            path: packaging/PKGBUILD
          - name: melo-bin
            path: packaging/melo-bin/PKGBUILD
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - name: Checkout main (with updated PKGBUILDs)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish ${{ matrix.name }} to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PKG: ${{ matrix.name }}
          SRC: ${{ matrix.path }}
        run: |
          set -euo pipefail

          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set — add it to publish to the AUR."
            exit 1
          fi

          # Absolute paths + GIT_SSH_COMMAND: container HOME isn't reliable across steps.
          mkdir -p /etc/aur-ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /etc/aur-ssh/key
          chmod 600 /etc/aur-ssh/key
          ssh-keyscan aur.archlinux.org > /etc/aur-ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i /etc/aur-ssh/key -o UserKnownHostsFile=/etc/aur-ssh/known_hosts -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"

          # makepkg refuses to run as root, so generate .SRCINFO as an unprivileged user.
          useradd -m builder
          git config --global --add safe.directory '*'

          git clone "ssh://aur@aur.archlinux.org/${PKG}.git" aur
          cp "$SRC" aur/PKGBUILD

          work="$(mktemp -d)"
          cp "$SRC" "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd '$work' && HOME=/home/builder makepkg --printsrcinfo" > aur/.SRCINFO

          cd aur
          git config user.name "Mbonikev"
          git config user.email "mb0ni@proton.me"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes for ${PKG}."
            exit 0
          fi
          git commit -m "${PKG} ${VERSION} (automated release)"
          git branch -M master
          git push origin master
